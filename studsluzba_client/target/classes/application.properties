# ============================================
# STUDENTSKA SLU?BA - KLIJENT KONFIGURACIJA
# ============================================

# Server API URL
api.base.url=http://localhost:8090/api

# Navigation History (OBAVEZAN FEATURE)
navigation.max.history=10

# Async Thread Pool
async.thread.pool.size=5

# JavaFX Application
javafx.application.name=Studentska Sluzba Client
javafx.application.version=1.0.0

# JasperReports
jasper.reports.output.directory=${user.home}/Desktop

# Logging
logging.level.org.raflab.studsluzba.client=INFO
logging.level.org.raflab.studsluzba.client.navigation=DEBUG
logging.level.org.raflab.studsluzba.client.services=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

# Spring Boot
spring.application.name=studsluzba-client
spring.main.web-application-type=none
spring.main.allow-bean-definition-overriding=true

# ===== ISKLJU?I JPA/DATABASE =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration